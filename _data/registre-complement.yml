# Complement du registre des sources : AJOUT EDITORIAL DE CE SITE, HORS PAQUET.
#
# Le paquet France-System-2026 v0.1 laisse trois dimensions presque vides
# (expertise, coercition, executif). Ces sources les etoffent. Elles ne se
# melangent pas au registre du paquet (_data/registre.json, importe tel quel) :
#   - identifiants FR-CPL-*, jamais FR-SRC-* ;
#   - memes champs que le registre, plus 'mots_cles' (tableau) et 'verification' ;
#   - 'use' est ecrit directement en francais : c'est notre contenu, lu tel quel.
#   - mots-cles pris dans le vocabulaire existant, pour passer par la table
#     _data/passage-dimensions.yml sans vocabulaire parallele.
#
# Regle de date de la methode : etat arrete au 2026-08-12. Un document posterieur
# n'entre pas ; quand la page d'accueil est posterieure, on cite le fichier
# anterieur qu'elle contient.
#
# status :
#   VERIFIED   URL ouverte et document reconnu le 2026-10-21
#   TO_VERIFY  pertinent, mais l'URL n'a pas pu etre lue (anti-robot) :
#              a confirmer a la main avant publication
#   Les sources bloquees par un anti-robot ont ete confirmees a la main par
#   l'editeur du site ; leur champ 'verification' le dit.
#
# Ecrit a la main ; scripts/importer-spec.py n'y touche jamais.

meta:
  auteur: "France-System-2026 (ce site)"
  date: "2026-10-21"
  statut: "Complément éditorial, hors paquet"

