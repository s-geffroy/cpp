  FR-SRC-0001: "L’état publié doit retenir la version en vigueur au 12 août 2026."
  FR-SRC-0002: "Comprend la Déclaration des droits de 1789, le préambule de 1946 et la Charte de l’environnement."
  FR-SRC-0003: "À utiliser pour la structure et le contexte, non en substitut des textes juridiques."
  FR-SRC-0004: "Éviter toute extrapolation du local au national."
  FR-SRC-0010: "Produit intérieur brut 2025 : base de l’état publié."
  FR-SRC-0011: "L’empreinte budgétaire n’est pas un indicateur de contrôle direct."
  FR-SRC-0012: "Séparer le financement de la propriété et de la fourniture du service."
  FR-SRC-0013: "Ne pas déduire un corporatisme du niveau des dépenses sociales."
  FR-SRC-0014: "Part de financement n’est pas propriété des offreurs de soins."
  FR-SRC-0020: "La propriété doit rester distincte de la régulation et des subventions."
  FR-SRC-0021: "Un énoncé de doctrine ne prouve pas un contrôle opérationnel dans chaque entreprise."
  FR-SRC-0022: "L’accès aux bénéficiaires effectifs est restreint ; le graphe du contrôle ultime peut exiger d’autres sources licites."
  FR-SRC-0023: "Limitation explicite inscrite dans le plan d’accès aux données."
  FR-SRC-0024: "Structure macroéconomique ; pas la propriété d’un groupe particulier."
  FR-SRC-0025: "À utiliser comme dénominateur structurel."
  FR-SRC-0026: "Des contraintes d’accès s’appliquent ; utiliser les statistiques publiques à défaut d’accès direct."
  FR-SRC-0030: "Utiliser les totaux sectoriels et la structure des entités supervisées."
  FR-SRC-0031: "Ne pas en déduire une coordination entre groupes."
  FR-SRC-0032: "Importance systémique n’est pas influence politique."
  FR-SRC-0033: "La supervision bancaire française est en partie européanisée."
  FR-SRC-0034: "Les dépôts des sociétés peuvent alimenter le graphe de détention et de gouvernance."
  FR-SRC-0040: "Les décisions de concurrence attestent de questions de pouvoir de marché, non d’un pouvoir politique."
  FR-SRC-0041: "Attribution d’un marché n’est pas influence ; n’en déduire qu’une transaction ou une dépendance."
  FR-SRC-0042: "Utiliser les montants attribués, les acheteurs, les titulaires et la procédure ; aucune déduction d’entente."
  FR-SRC-0043: "Les aides exigent une quantification par croisement de plusieurs sources."
  FR-SRC-0050: "Régulation des temps de parole n’est pas contrôle éditorial."
  FR-SRC-0051: "Les seuils juridiques ne mesurent pas à eux seuls la concentration de l’exposition."
  FR-SRC-0052: "La propriété entreprise par entreprise doit être mise à jour avec les dépôts de 2026."
  FR-SRC-0053: "Financement public n’est pas contrôle éditorial gouvernemental."
  FR-SRC-0054: "Distinguer les témoignages, les constats, les recommandations et les affirmations contestées."
  FR-SRC-0055: "L’exposition doit rester distincte de la propriété."
  FR-SRC-0056: "Propre à cette affaire ; ne pas généraliser à toutes les plateformes."
  FR-SRC-0060: "Couverture des infrastructures et part de marché sont à séparer."
  FR-SRC-0061: "Source au format PDF ; une extraction ultérieure des tableaux passera par une capture d’écran du PDF."
  FR-SRC-0062: "Capacité réglementaire, et non intention."
  FR-SRC-0063: "Capacité de sécurité n’est pas coercition politique."
  FR-SRC-0070: "Le système énergétique est hybride : réseaux régulés, fourniture concurrentielle et relations de propriété publique."
  FR-SRC-0071: "Utiliser les indices HHI et les parts de marché réels plutôt qu’une concentration impressionniste."
  FR-SRC-0072: "Les pouvoirs de gros et de détail doivent rester distincts."
  FR-SRC-0080: "Contact déclaré n’est pas capture ni coordination."
  FR-SRC-0081: "Représentativité n’est pas orientation politique."
  FR-SRC-0082: "Le grand nombre d’organisations plaide contre le traitement de la représentation comme un bloc corporatiste unique."
  FR-SRC-0083: "Traiter les relations de négociation formelle séparément de la représentation d’intérêts politique."
  FR-SRC-0090: "Recommandation ou expertise n’est pas décision politique finale."
  FR-SRC-0091: "L’intervention sur l’approvisionnement est distincte de la propriété."
  FR-SRC-0100: "Le secteur de la défense présente des liens de client étatique et de souveraineté exceptionnellement forts."
  FR-SRC-0101: "Présence au répertoire n’est pas dépendance à l’égard de l’État."
  FR-SRC-0110: "Recommandation n’est pas injonction juridique directe ; qualifier l’instrument."
  FR-SRC-0111: "Coder la force juridique séparément de la pression politique."
  FR-SRC-0112: "Le gouvernement français ne fixe pas les taux directeurs de la zone euro."
  FR-SRC-0113: "Distinguer la participation de la Banque de France du contrôle par l’exécutif national."
  FR-SRC-0114: "À utiliser comme diagnostic externe, non comme preuve unique."
  FR-SRC-0115: "Guide de jurisprudence ; les affaires françaises effectives doivent être codées séparément."

# --- Lecture de chaque arete (interpretation_guardrail) ----------------
# Traduction du garde-fou d'interpretation attache a chaque arete : ce que la
# relation prouve, et ce qu'elle ne prouve pas. C'est le texte le plus important
# du paquet ; il devait etre lisible.
lectures:
  FR-EDGE-0001: "Le Parlement légifère et contrôle le Gouvernement dans le cadre constitutionnel."
  FR-EDGE-0002: "Pouvoirs de nomination du Président de la République ; leur portée exacte est fixée par la Constitution."
  FR-EDGE-0003: "Le contrôle contraint les normes législatives et exécutives."
  FR-EDGE-0004: "Compétences réparties entre les niveaux territoriaux."
  FR-EDGE-0010: "Relation d’État actionnaire ; les droits de gouvernance varient selon la participation."
  FR-EDGE-0011: "Contrats entre acheteur et fournisseur. Aucune influence ne se déduit du seul contrat."
  FR-EDGE-0012: "Relation possible de subvention ou d’aide fiscale ; à quantifier dispositif par dispositif."
  FR-EDGE-0020: "Supervision bancaire française et européenne."
  FR-EDGE-0021: "Conditions monétaires de la zone euro et cadre du mécanisme de surveillance unique."
  FR-EDGE-0022: "Obligations des sociétés cotées et du marché des valeurs mobilières."
  FR-EDGE-0023: "Droit de la concurrence, contrôle des concentrations et des abus."
  FR-EDGE-0030: "Règles de pluralisme et de lutte contre la concentration."
  FR-EDGE-0031: "Contrôle et structure de l’audiovisuel de service public."
  FR-EDGE-0032: "Les plateformes peuvent s’interposer dans la découverte, la distribution et la négociation avec les éditeurs."
  FR-EDGE-0033: "À alimenter avec des données de recettes et de publicité ; structurelle à ce stade."
  FR-EDGE-0040: "Régulation des communications électroniques."
  FR-EDGE-0041: "Régulation de la vie privée et du traitement des données, et sanctions."
  FR-EDGE-0042: "Capacité de cybersécurité pour les systèmes critiques et le secteur public ; le périmètre doit être codé selon le régime juridique."
  FR-EDGE-0050: "Régulation de l’énergie de gros et de détail, et surveillance des marchés."
  FR-EDGE-0051: "Cadre des tarifs et des investissements des réseaux d’énergie régulés."
  FR-EDGE-0060: "Relation formelle de négociation et de représentation."
  FR-EDGE-0061: "Représentation et accords au niveau de l’entreprise."
  FR-EDGE-0062: "Représentation d’intérêts déclarée ; ne prouve pas une capture."
  FR-EDGE-0063: "Voie d’entrée par le registre de l’influence étrangère ; les relations effectives exigent des déclarations enregistrées."
  FR-EDGE-0070: "L’évaluation et les recommandations de la Haute Autorité de santé peuvent cadrer les options ; la décision finale reste distincte."
  FR-EDGE-0071: "Contrôle des autorisations, de la sécurité et des pénuries."
  FR-EDGE-0080: "L’État comme acheteur stratégique et acteur de politique industrielle."
  FR-EDGE-0090: "Recommandations du Semestre européen et coordination des politiques de l’Union."
  FR-EDGE-0091: "La Banque de France participe à l’Eurosystème ; la politique n’est pas fixée au niveau national."
  FR-EDGE-0092: "Le cadre juridique de la Convention européenne contraint l’action de l’État dans les domaines de droits protégés."

