# Libelles francais du paquet France-System-2026.
# Cle Liquid : site.data.libelles
#
# ECRIT A LA MAIN. scripts/importer-spec.py n'ecrit jamais dans ce fichier :
# un reimport (v0.2, v0.3...) regenere _data/*.json et laisse ces traductions
# intactes. Seuls les libelles NOUVEAUX sont alors a ajouter ici.
#
# Les CLES sont des valeurs machine et ne changent jamais. Les VALEURS sont du
# contenu lu par les visiteurs : elles s'ecrivent en francais normal, avec
# leurs accents. La regle « sans accents » du depot vise l'infrastructure --
# ces commentaires, par exemple -- pas ce qui s'affiche sur le site.
#
# Ce qui n'est PAS traduit, et ne doit pas l'etre : les titres des documents
# sources, leurs URL, leurs identifiants et leurs dates. Ce sont des references
# citables -- traduire le titre d'un document officiel casse la citation.

# --- Les 15 dimensions de pouvoir (power_dimensions.csv) -------------------
dimensions:
  P-LEGAL:
    label: "Juridique et normatif"
    definition: "Capacité à créer ou à contraindre des règles obligatoires."
  P-EXEC:
    label: "Exécutif et administratif"
    definition: "Capacité à mettre en œuvre une politique et à allouer la capacité administrative."
  P-FISCAL:
    label: "Budgétaire et fiscal"
    definition: "Impôts, dépenses, transferts, garanties."
  P-OWN:
    label: "Propriété"
    definition: "Contrôle du capital et droits de gouvernance."
  P-FIN:
    label: "Financier"
    definition: "Crédit, dette, assurance, accès au marché de capitaux, liquidité."
  P-MARKET:
    label: "Marché"
    definition: "Part de marché, pouvoir d'achat ou de vente, barrières au changement de fournisseur."
  P-INFRA:
    label: "Infrastructure"
    definition: "Contrôle des réseaux physiques et numériques essentiels."
  P-INFO:
    label: "Information"
    definition: "Production, édition, distribution, classement, exposition des audiences."
  P-REG:
    label: "Régulation"
    definition: "Autorisation, supervision, normalisation, sanction."
  P-JUD:
    label: "Juridictionnel et contrôle"
    definition: "Capacité à annuler, suspendre ou réparer des actes."
  P-LABOR:
    label: "Travail et action collective"
    definition: "Négociation collective, mobilisation, action revendicative."
  P-EXPERT:
    label: "Expertise et production de normes"
    definition: "Données, indicateurs, évaluation, cadrage des options recevables."
  P-NET:
    label: "Réseau et influence"
    definition: "Représentation d'intérêts, accès professionnel, mobilité des personnes, accès à l'agenda."
  P-COERC:
    label: "Coercition et sécurité"
    definition: "Capacité coercitive légale, police, sanctions, sécurité."
  P-EXT:
    label: "Externe et supranational"
    definition: "Contraintes et dépendances européennes, de la zone euro, de la CEDH et internationales."

