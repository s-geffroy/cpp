# Registre des acteurs v0.2 : AJOUT EDITORIAL DE CE SITE, HORS PAQUET.
#
# Pilote : les participations de l'Etat dans les societes cotees de son
# portefeuille, plus EDF (retiree de la cote). Schema :
# assets/donnees/ajout_acteurs.schema.json.
#
# Regles appliquees ici (cf. methode, regles du graphe des entreprises) :
#   - seuls les liens DIRECTS sont saisis ; une chaine Etat -> holding ->
#     societe s'ecrit en deux liens, jamais additionnes ;
#   - capital et droits de vote toujours distincts ;
#   - 'controle' reprend la qualification ECRITE par la source, sinon
#     non_qualifie ; il n'est jamais deduit du pourcentage ;
#   - categories : FR-NODE-013 si l'Etat detient la majorite du capital
#     (directement ou par une holding qu'il detient entierement), ou si le
#     document de la societe qualifie le controle de l'Etat (seul ou dans un
#     concert ou il n'est pas declare minoritaire), ou si la majorite est
#     tenue par une entite publique classee 013 (Caisse des depots, Bpifrance)
#     et le document le dit ; FR-NODE-014 pour un grand
#     groupe francais hors de ces cas ; puis les categories sectorielles. Une
#     societe etrangere ou trop petite pour 014 n'a que sa categorie sectorielle ;
#   - aucune personne physique ;
#   - pages : « imprimee / PDF » ; pour les depots ESEF (xhtml), page
#     imprimee seule.
#
# Statut VERIFIED : chaque valeur a ete relue dans la source citee, puis
# validee par l'editeur du site le 2026-10-21. Une ligne en P2 ou P3 reste
# VERIFIED : c'est sa transcription qui est verifiee, sa force probante est
# dite par 'preuve' et 'incertitude'.
#
# Les textes (notes, garde-fous, incertitudes) sont lus par les visiteurs :
# francais normal, avec accents.

meta:
  auteur: "France-System-2026 (ce site)"
  date_arret: "2026-08-12"
  statut: "Pilote et périmètre de défense, validés le 2026-10-21"
  recoupement: "Les détentions de l’État ont été recoupées avec le rapport d’activité 2025-2026 de l’Agence des participations de l’État. Ce rapport, paru en octobre 2026, est postérieur à la date d’arrêt : il n’est cité nulle part. Pour les sociétés cotées, il ne montre aucun écart au-delà de l’évolution des droits de vote double entre le 31 décembre 2025 et le 30 juin 2026, et confirme le maintien de l’État à 29,7% du capital d’Eutelsat. Pour les entreprises non cotées, il donne au 31 décembre 2025 les mêmes parts que les sources citées, souvent arrêtées un an plus tôt."
  lacunes:
    - nom: "Civipol"
      raison: "Inscrite au périmètre de l’APE, mais la part de l’État au capital n’est publiée dans aucune source lue."
    - nom: "Bull"
      raison: "L’État en est l’unique actionnaire depuis le 31 mars 2026 (communiqué d’Atos), mais l’entité juridique acquise n’est pas nommée : deux sociétés candidates, aucune confirmée."
    - nom: "Roxel France"
      raison: "Ajoutée en septembre 2025 à la liste des entités où l’État détient une seule action ; actionnariat et droits non instruits."
    - nom: "Adit"
      raison: "L’État y détient une action, mais l’activité (intelligence économique) sort du périmètre de l’armement retenu ici."
    - nom: "GEAST"
      raison: "L’État a cédé son action à EDF en 2024 ; retirée de la liste officielle en 2025, la société a été dissoute."
    - nom: "LMB"
      raison: "L’État y a acquis une action en mars 2026, mais la société ne figure pas dans la liste officielle à la date d’arrêt."
    - nom: "Archos, Actia Group, Kalray, Drone Volt, NSE, SII, Logic Instrument"
      raison: "Entreprises cotées susceptibles de relever du périmètre des entreprises de défense privées ; leur rapport annuel n’a pas pu être lu, le critère n’est pas testé."
    - nom: "CALIBRE (ex-Cybergun)"
      raison: "Sa filiale de défense porte l’essentiel de l’activité, mais aucune part n’est publiée telle quelle, et l’actionnaire de référence (45,05%) n’est pas nommé."
    - nom: "Theon International, KNDS (dépendance à l’État client)"
      raison: "Ni l’un ni l’autre ne publie de part de chiffre d’affaires réalisée en France ou avec l’État français : Theon ne détaille pas la France, KNDS ne la publie qu’en montant et écrit seulement que l’État français pèse « plus de 10% »."
    - nom: "Crédit Mutuel Alliance Fédérale (BFCM), Crédit Mutuel Arkéa"
      raison: "Groupes régionaux du Crédit Mutuel qui publient leur propre document d’enregistrement : non lus. L’organe central, une association sans capital, n’a pas d’actionnaire."
    - nom: "Caisses régionales de Crédit Agricole"
      raison: "Les 39 caisses détiennent ensemble SAS Rue La Boétie, mais la part de chacune n’est publiée dans aucune source lue."
    - nom: "HSBC Holdings plc"
      raison: "Société de tête du groupe HSBC, cotée à Londres ; seul son lien à 100% avec HSBC Bank plc est connu, par le document de sa filiale française."
    - nom: "Groupe Figaro"
      raison: "Sa page de gouvernance nomme Dassault Médias comme actionnaire, sans pourcentage ni précision sur la société détenue (Groupe Figaro ou Société du Figaro) ; le lien entre Dassault Médias et le Groupe industriel Marcel Dassault n’est documenté nulle part."
    - nom: "CMA Media, BFM TV, RMC"
      raison: "L’Autorité de la concurrence établit le contrôle exclusif de CMA CGM sur Altice Media (décision 24-DCC-141) ; la répartition avec Merit France est confidentielle, et la société qui a succédé à Altice Media n’est pas établie."
    - nom: "Groupe Le Monde, Groupe Amaury (L’Équipe)"
      raison: "Aucun document primaire lu ne donne l’actionnaire direct ni sa part."
    - nom: "Les Echos-Le Parisien"
      raison: "LVMH publie un taux d’intérêt de 100% dans sa liste de consolidation, sans nommer le détenteur direct."
    - nom: "Bayard (La Croix)"
      raison: "Ses mentions légales donnent la Congrégation des Augustins de l’Assomption à 93,7% du capital ; aucun identifiant officiel de la congrégation n’est établi."
    - nom: "Orfimar, Amber Capital"
      raison: "Actionnaires au-delà de 5% de Bolloré SE (5,52%) et de Louis Hachette Group (7,45%) : homonymes non départagés, fonds non nommés."
    - nom: "Holdings de la famille Mittal (ArcelorMittal), Établissements Peugeot Frères (Stellantis)"
      raison: "Leur document ne publie qu’un total de groupe, ou des nombres d’actions sans pourcentage par entité ; ce site ne calcule pas la part de chacune."
    - nom: "STMicroelectronics Holding N.V."
      raison: "Détient 27,5% de STMicroelectronics pour les États français et italien ; aucun identifiant officiel trouvé, et le détenteur direct serait sa filiale STMicroelectronics Holding II B.V."
    - nom: "Holdings familiales Badinter (Publicis), Artisan Partners (Danone)"
      raison: "Au-delà de 5%, mais l’entité juridique n’est pas nommée ou pas vérifiée dans le document."
    - nom: "Caisse des dépôts (Veolia)"
      raison: "5,04% du capital au 30 juin 2026, mais en total de groupe avec CNP Assurances et LBP Prévoyance ; la dernière part directe publiée, 3,11% en mars 2025, est sous le seuil."
