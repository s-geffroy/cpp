    pages:
      - { url: /representants-interets/, titre: "Représentants d’intérêts" }
  labor_social_partners:
    categories: [FR-NODE-042, FR-NODE-043, FR-NODE-044]
  health_expertise_medicines:
    categories: [FR-NODE-027, FR-NODE-028, FR-NODE-040, FR-NODE-041]
  defense_industry:
