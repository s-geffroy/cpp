# Page /provenance/ : rattachement des domaines du paquet aux categories
# d'acteurs et aux pages de ce site.
#
# AJOUT EDITORIAL DE CE SITE, HORS PAQUET. Le paquet France-System-2026 v0.1
# ne relie pas ses 34 domaines de couverture a ses 55 categories d'acteurs.
# Cette table est un jugement de lecture, revisable, publie comme tel. Elle
# sert seulement a compter, sur la page /provenance/, les acteurs nommes et les
# liens qui relevent de chaque domaine. Une categorie peut relever de
# plusieurs domaines : les comptes ne s'additionnent donc pas d'une ligne a
# l'autre.
#
# Ecrite a la main. scripts/exporter-ajouts.py verifie que chaque domaine
# existe dans la couverture, que chaque categorie existe et qu'aucune des 55
# categories n'est oubliee.
#
# categories : liste vide quand aucune categorie du paquet ne correspond au
#   domaine ; la page affiche alors « sans objet », jamais zero.
# pages : pages de ce site qui exploitent le domaine (titre lu par les
#   visiteurs, en francais normal).

meta:
  auteur: "France-System-2026 (ce site)"
  date: "2026-11-03"
  statut: "Correspondance éditoriale, hors paquet"

domaines:
  constitutional_state:
    categories: [FR-NODE-001, FR-NODE-002, FR-NODE-003, FR-NODE-004, FR-NODE-005, FR-NODE-006, FR-NODE-007]
  territorial_government:
    categories: [FR-NODE-008, FR-NODE-009, FR-NODE-010]
  macro_public_finance:
    categories: []
  social_protection_health_finance:
    categories: [FR-NODE-011]
  state_ownership:
    categories: [FR-NODE-012, FR-NODE-013]
    pages:
      - { url: /acteurs/, titre: "Registre des acteurs" }
  # Les gestionnaires d'actifs et les Etats etrangers y figurent comme
  # detenteurs : c'est a ce titre que le registre des acteurs les nomme.
  corporate_ownership_graph:
    categories: [FR-NODE-014, FR-NODE-015, FR-NODE-016, FR-NODE-018, FR-NODE-055]
    pages:
      - { url: /acteurs/, titre: "Registre des acteurs" }
      - { url: /beneficiaires-effectifs/, titre: "Bénéficiaires effectifs" }
  # Credit et dette : les banques et les creanciers, pas les detenteurs de capital.
  corporate_financing_graph:
    categories: [FR-NODE-017, FR-NODE-054]
  banking_insurance:
    categories: [FR-NODE-017, FR-NODE-018, FR-NODE-019]
    pages:
      - { url: /acteurs/, titre: "Registre des acteurs" }
  capital_markets:
    categories: [FR-NODE-020, FR-NODE-054]
  competition:
    categories: [FR-NODE-021]
  procurement:
    categories: [FR-NODE-049, FR-NODE-050]
    pages:
      - { url: /commande-publique/, titre: "Commande publique" }
      - { url: /acteurs/marches/, titre: "Marchés des acteurs" }
  business_aid:
    categories: []
  # Arcom regule tous les medias, pas le seul audiovisuel public.
  media_ownership_pluralism:
    categories: [FR-NODE-022, FR-NODE-035, FR-NODE-039]
    pages:
      - { url: /acteurs/, titre: "Registre des acteurs" }
  public_media:
    categories: [FR-NODE-036]
    pages:
      - { url: /acteurs/, titre: "Registre des acteurs" }
  platforms_information_distribution:
