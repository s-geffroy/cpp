  telecom_infrastructure:
    categories: [FR-NODE-023, FR-NODE-034]
  data_privacy:
    categories: [FR-NODE-025]
  cybersecurity:
    categories: [FR-NODE-029]
  energy:
    categories: [FR-NODE-024, FR-NODE-032, FR-NODE-033]
  lobbying_revolving_doors:
