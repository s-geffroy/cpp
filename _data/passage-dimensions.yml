# Table de passage : mots-cles libres du registre -> dimensions canoniques P-*.
#
# AJOUT EDITORIAL DE CE SITE, HORS PAQUET. Le paquet France-System-2026 v0.1
# ne fournit aucune correspondance entre le champ libre 'power_dimensions' du
# registre et les 15 identifiants P-*. Cette table est un jugement de lecture,
# revisable, publie comme tel et telechargeable. Elle sera remplacee par une
# table du producteur du paquet si celle-ci vient.
#
# Ecrite a la main. scripts/importer-spec.py ne l'ecrit JAMAIS : il se contente
# de l'exporter en CSV pour le telechargement.
#
# Regle de lecture : un mot-cle qui designe un SECTEUR (sante, energie,
# defense...) ou un cadre general (economique, institutionnel) et non une
# FORME de pouvoir recoit une liste vide. La source reste rattachee aux
# dimensions par ses autres mots-cles. Les notes sont lues par les visiteurs :
# francais normal, avec accents.

meta:
  auteur: "France-System-2026 (ce site)"
  date: "2026-10-21"
  statut: "Correspondance éditoriale, hors paquet"

